 mahsa.1.t: "Murder of Mahsa Amini"
 mahsa.1.d: "Two days ago, at around midnight, A Kurdish-Iranian woman known as Mahsa Amini was arrested at the entry of the Shahid Haghani Expressway in Tehran.\n\nShortly after being arrested, she was allegedly beaten up by the police while in a police van.\n\nFollowing that, She was Transfered to the Kasra Hospital and was in a Coma for two days up until her death a few hours ago.\n\nMany Iranians were already unhappy with the Hijab laws and now with the Murder of Mahsa Amini, this may cause riots."
 mahsa.1.a: "§RThe People will not be happy about this§!"
