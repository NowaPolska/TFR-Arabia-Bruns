l_english:
 #Starting screen
 PER_country_summary: "§YCountry Summary§!:\nIran is a country that has a lot of history, the past 100 years have been both a \"century of humiliation\" and a period of radical change that has deeply reshaped the country's identity. In the first 50 years, China was transformed from the \"Kingdom of Heaven\" into the \"Sick Man of East Asia,\" invaded and subjugated successively by Western powers and Japanese militarists. In the subsequent 50 years, China's so-called \"Armageddon of Two Fates,\" the enduring conflict between communism and capitalism, has taken the country through an incredible succession of political turmoil and economic prosperity.\nNow, two decades into the 21st century, under the leadership of the Communist Party of China, this great nation is sailing solemnly on the course of \"great rejuvenation\". Some have called this era the \"Chinese Century\", while others believe that China would eventually collapse, consumed by its own ambitions like other nations that have challenged hegemony throughout history. Now, it seems that the land of the CPC, Xi Jinping and 1.4 billion Chinese is once again approaching a turning point in history..."
 PER_country_paths: "\n\n\n§YCountry Paths§!:\n§G - Principlists§!\n§O - Reformists§!\n§a - IRGC§!\n§L - and other paths§!"
