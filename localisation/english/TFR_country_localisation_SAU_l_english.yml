 radiated_land_desc: "The dunes remain quiet as the radiation settels... if human life can return to the annialated cities of the middle east is still unkowen... thoose who stayed have to adaped to thier new hellscape in which they live, or at least try to do so..."
 unpopulare_rule: "Unpopulare Rule"
 unpopulare_rule_desc: "The majority of the population sees our goverment just as an saudi pupet, leeding to low support in our goverment and cause..."
 17th_saudi_army: "17th Saudi Army"
 17th_saudi_army_desc: "The Elite 17th Saudi Tank Division is the only reason why we the free syrian Republic still havent collapsed. Despite thier support begin greatfully accepted by us, the syrian populace not so much. Aswell as the growing influence which the 17th army holds over our army and goverment. While we still need them, we need to make plans to... get rid of them in the future."
 Back_with_vengence: "Back with Vengence"
 Back_with_vengence_desc: "WE WILL SAVE SYRIA FROM ASSADSIST AND SAUDI TERRORISM, NO MATTER THE COST WE HAVE TO PAY!"
