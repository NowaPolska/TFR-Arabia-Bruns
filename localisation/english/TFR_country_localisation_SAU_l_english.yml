 saudi.1.t: "King Salman Admitted to Hospital"
 saudi.1.d: "Today, King Salman bin Abdulaziz Al Saud was admitted to the emergency department of King Faisal Specialist Hospital in Riyadh after experiencing severe respiratory problems. The Royal Court has assured the public that he is receiving the best medical care available. Let us pray for the King's recovery."
 saudi.1.a: "Pray for the King"
 saudi.2.t: "The War in Yemen"
 saudi.2.d: "It has become increasingly apparent that the conflict in Yemen will not have a definitive conclusion within the next five years. Our Houthi opponents have repeatedly demonstrated their ability to exploit our weaknesses despite relying on aging weapons and irregular forces. Although several of our recent offensives have failed to achieve their objectives, the Kingdom remains determined to continue supporting the internationally recognized Yemeni government.\n\nWe cannot allow the establishment of a hostile, Iranian-aligned state on our southern border. The security of the Kingdom depends upon a political settlement that prevents Yemen from becoming a permanent base for forces hostile to Saudi Arabia."
 saudi.2.a: "More men, more bradleys."
 saudi.3.t: "Salman's Health Fails"
 saudi.3.t: "King Salman's Health Deteriorates"
 saudi.3.d: "Great uncertainty now hangs over the Kingdom. Following King Salman bin Abdulaziz Al Saud's admission to the emergency department of KFS Hospital several weeks ago, it has become clear that his condition has deteriorated significantly due to COVID-19. Doctors have reported that the King has suffered severe complications affecting his throat and lungs.\n\nHe has been placed on mechanical ventilation, as his lungs have become too severely deteriorated to provide his body with sufficient oxygen without assistance. We can only pray for his recovery, though there are growing fears that the situation may take a tragic turn. May Allah be with him and for him to live the Longest of lives.."
 saudi.3.a: "Pray for Baba Salman!"
 saudi.4.t: "King Salman Is Dead."
 saudi.3.t: "King Salman's Health Deteriorates"
 saudi.3.d: "Great uncertainty now hangs over the Kingdom. Following King Salman bin Abdulaziz Al Saud's admission to the emergency department of KFS Hospital several weeks ago, it has become clear that his condition has deteriorated significantly due to COVID-19. Doctors have reported that the King has suffered severe complications affecting his throat and lungs.\n\nHe has been placed on mechanical ventilation, as his lungs have become too severely deteriorated to provide his body with sufficient oxygen without assistance. We can only pray for his recovery, though there are growing fears that the situation may take a tragic turn. May Allah be with him and for him to live the Longest of lives.."
 saudi.3.a: "Pray for Baba Salman!"
 saudi.4.t: "King Salman Is Dead."
 saudi.4.d: "Today, the Saudi nation mourns the loss of their monarch.\n\n This morning, King Salman bin Abdulaziz Al Saud passed away at the age of 85 due to complications not long after he tested positive for COVID-19. While this inevitability had been dreadfully anticipated over the past several months, its arrival has nonetheless been a shock to the nation. Various statements have trickled out from the royal family and those in positions of influence who speak fondly of the King, lamenting his life and leadership of the country. Already, many foreign leaders have sent their condolences regarding his untimely passing, and Crown Prince Mohammed bin Salman has delivered heartfelt words regarding his father's death, wishing to honour his memory.\n\n As the funeral process continues and prayers mount across the kingdom, the mood in the air is terrifying. However, the King's passing has begun to set certain things in motion; most pressingly, an all-too-familiar succession crisis. In the background, various princes have begun to spread word amongst key officials and other royal family members. As the succession crisis slowly but surely begins to rear its ugly head and the time for mourning comes to a close, Mohammed's fair share of enemies within the kingdom have taken this opportunity to sow dissent towards the kingdom's de facto leader. This process will likely continue even after the new king is crowned."
 saudi.4.a: "Allah help us."
 saudi.5.t: "Salman bin Abdulaziz bin Salman Al Saud Found Dead!"
 saudi.5.d: "Our young prince has met with a terrible fate! While playing the popular MMO DOTA 2, an armed mercenary stormed into his room and shot him at point-blank range with a rifle, With it being shared on Bad Boy Networks."
 saudi.5.a: "Seriously? This is Stupid."
 saudi.6.t: "Mohammed bin Salman Crowned"
 saudi.6.d: "As the official period of mourning following the death of King Salman ends, a period of celebration begins in Riyadh: his son, Prince Mohammed, ascends to the Saudi throne as King Mohammed, the eighth ruler of a united Saudi Arabia. His coronation represents a new era in Saudi politics; for nearly seventy years, the Saudi throne had been ruled by the increasingly elderly sons of the first king, Ibn Saud. But with all the sons either dead or disqualified from succession, it falls to the new generation to rule.\n\n The matter is further complicated by Mohammed's reputation. Since solidifying his position, he has overseen a crackdown on the royal family, purging uncles and cousins on charges of treason and corruption. Few doubt the lengths he has gone to obtain his throne, but many worry how much further he will go in order to hold on to it.\n\n The king is dead, long live the king."
 saudi.6.a: "You Think Talal Stands another CHANCE?!.."
 saudi.6.b: "A coalition must be formed immediately!"
 saudi.6.c: "The Peninsula Stands Uncertain.."
 saudi.7.t: "Princes begin Gossiping.."
 saudi.7.d: "Those damn traitors are not going to give us a break. Even at the lowest point of our nation, instead of trying to help Saudi Arabia, they are trying to divide and destroy our nation.\n\nBut at the end of the day, they will cry around and go home... at least we hope that happens."
 saudi.7.a: "Get your own monarch!"
 saudi.8.t: "PMCs Attempt to Arrest Saudi King!"
 saudi.8.d: "Our forces failed to neutralize the rogue prince Muhammad bin Nayef yesterday. Despite investing thousands of dollars into RSLF-Branded PMCs, they failed to deliver the desired result. 8 armed men entered MBS's residence under the cover of darkness and engaged in a firefight with Bin Salman's own private security before withdrawing after failing to penetrate the residence's exterior defenses.\n\n Unfortunately, this has brought the eyes of the world upon us, with many international commentators demanding sanctions in response to supposed 'suppression of political opposition.' Thankfully, our PR team has been hard at work and has commented that such an assassination attempt was a 'sure sign that Allah wishes for his death.'"
 saudi.8.a: "Those bastards..."
 saudi.9.t: "Prince Coalition Forms!"
 saudi.9.d: "Despite our continuous efforts at political stabilization, our country has fallen into the chaos of civil war. The traitors Muhammad bin Nayef and Ahmed bin Abdulaziz have started an open rebellion in the south of the country, forming 'the Royal Arabian Council' in their own attempt to seize the throne. In the north, liberal and youth wings have started their own rebellion, with a suspicious amount of Israeli-supplied arms in their possession. Meanwhile, protests have broken out in Mecca with rumors of a possible islamist uprising, although we are doing our best to keep the area under control. Breaking open the great bank of wealth that the Saudi Royal Family owns, we will do everything in our power to restore civil order.\n\nThe godless traitors are disorganized and divided while we are fighting under our divine cause of saving Saudi Arabia. They will fall! Allah is with us!"
 saudi.9.a: "God help us..." 
 saudi.10.t: "Jihadists Organize in Mecca"
 saudi.10.d: "Unsettling reports come out of Mecca today as the neutral government of Khalid bin Faisal Al-Saud was violently overthrown by a band of radical Islamist terrorists. They have declared to 'Grant Jihad' to 'cleanse' Saudi Arabia from Western degeneracy.\n\nA new contender joins the civil war..."
 saudi.10.a: "More sheep to the slaughter!"
 saudi.10.b: "We are Allah's warriors."
 saudi.11.t: "Shia Militias Organize"
 saudi.11.d: ""
 saudi.11.a: "More sheep to the slaughter!"
 saudi.12.t: "Russia Remains Defiant on Oil"
 saudi.12.d: "Despite all of our diplomatic efforts, Russia has refused to negotiate a new oil agreement with us and OPEC. This risks a collapse of the entirety of OPEC, as without Russia our market share of global oil reserves has decreased from 40% to under 20%.\n\nThose Russian bastards! If they want it the hard way, we will give it to them the hard way. Let's see how long it takes before they come begging us to reduce global oil prices."
 saudi.12.a: "Reduce the price of oil and flood the market."
 saudi.18.t: "Yahya Assiri Returns to Jeddah"
 saudi.18.d: "Political exile and rights activist Yahya Assiri has returned to Saudi Arabia following the civil unrest that started recently. A former Saudi Air Force pilot, he applied for political asylum in the United Kingdom following the arrest of several prominent members of the Saudi Civil and Political Rights Association.\n\n His return to the country has sparked widespread controversy, with young feminists praising him and welcoming him with open arms, while conservatives slam him for being a traitor and Western spy.\n\n With his return, Assiri has announced that he will be committed to ideals of non-violence, yet how substantial those promises truly are is questioned by many within our administration."
 saudi.18.a: "Another Israeli Spy!"
 saudi.19.t: "Failed RSAF-Led Coup"
 saudi.19.d: ""
 saudi.19.a: "Whoosh!"
 saudi.22.t: "Mass ''Gatherings'' in Riyadh"
 saudi.22.d: "Today, tens of thousands of people have taken to the streets in Riyadh to clash with the Saudi government. This is an extremely unsettling escalation which has to be ended as soon as possible, with force if necessary."
 saudi.22.a: "Too little, too late..."
 saudi.24.t: "Safar al-Hawali Denounces the King"
 saudi.24.d: "Safar al-Hawali, a prominent Islamic scholar and leader of the Sahwa movement, has denounced Crown Prince Mohammed bin Salman this afternoon. Calling him ''Just Another Visionary'', he has continued his demands for the removal of American troops and cultural influences from the Arabian Peninsula. This comes at a time when political divides rip through the country, with many international observers eyeing a possible war.\n\n Israel has issued a statement condemning Hawali's declaration, demanding an apology for 'spreading antisemitic conspiracy theories.'\n\n Many supporters of Hawali seem to be mobilizing in preparation for a 'Great FIGHT! against the West', as religious extremism and factionalism threaten to tear the country apart at its roots."
 saudi.24.a: "Another Al-Muqrin? Just go to sleep."
 saudi.31.t: "The Virus Arrives in Arabia"
 saudi.31.d: "The inevitable has happened, as the global pandemic has reached the Arabian Peninsula. The Umrah pilgrimage to the Great Mosque of Mecca has been temporarily suspended due to absurd infection risks. While the Saudi healthcare system has been completely overrun, the death toll remains relatively small compared to other countries with a similar population.\n\nThe Saudi government has already announced a travel ban to China and a curfew in our major cities, with movement being restricted from 6 a.m. to 3 p.m. Let's pray that global vaccine research will result in the fast development of a vaccine against COVID-19."
 saudi.31.a: "Uncertain times we live in."
 saudi.32.t: "Intervention in the Libyan Civil War?"
 saudi.32.d: "Libya has been in tatters ever since the death of Muammar al-Gaddafi, and we see major interest in this conflict as there are so many opportunities to 'earn money'—by which we mean exploiting Libya's minerals and oil. In exchange, we would help whichever side allows us access to their resources."
 saudi.32.a: "We are not interfering in Libyan matters."
 saudi.32.b: "Help the legitimate Tripoli Government."
 saudi.32.c: "Help the Libyan Rebels."
 saudi.33.t: "New Oil Deal with Saudi Arabia?"
 saudi.33.d: "Today, the King of Saudi Arabia, King Mohammed bin Salman, together with the Saudi Economic Minister, met German Chancellor Angela Merkel in order to discuss a possible new oil deal. This comes at a great time as the Russian Orcs are cutting off their cheap gas and oil supply to Germany. We now have an opportunity to strike a deal with Saudi Arabia to finally become somewhat less reliant on Russia.\n\nThis could anger Russia and make us reliant on a Middle Eastern nation, which will not solve Germany's energy dependency, only change the country we are addicted to. The AfD and FDP oppositionists are heavily critical of this proposal. The question is in the air: is the deal actually worth it?"
 saudi.33.a: "This is the best deal possible! Hell yeah!"
 saudi.33.b: "Umm, sorry, daddy Putin will be mad, so no."
 saudi.34.t: "German-Saudi Oil Agreement Signed!"
 saudi.34.d: "After a very exhausting round of talks and negotiations with the German Economic Minister and Chancellor Angela Merkel, an agreement was made! This comes as a major breakthrough for the Saudi nation, as we now not only have an alternative trade partner to those bloody Russians, but have also secured large amounts of German economic investments into the Saudi economy. This will be the first step toward stopping Saudi economic stagnation, and with Germany on board, it won't take long before the rest of Western Europe comes flying to Riyadh for a new trade deal with us as well."
 saudi.34.a: "We did it!"
 saudi.35.t: "No Agreement Was Made.."
 saudi.35.d: "Despite all of our efforts, Germany remained defiant and rejected our trade deal. This comes as a big surprise as Germany is energy dependent on Russia.\n\nSadly, with no agreement, it looks like our economic growth will not increase anytime soon..."
 saudi.35.a: "God damn it."
 saudi.36.t: "A Deal with Arabia?"
 saudi.36.d: "Today, Chairman Xi Jinping flew to Riyadh to discuss a possible oil deal between our two nations. This would come in handy as China is greatly dependent on foreign oil imports, and it would also boost our economic growth. On the other hand, the problem of dependency would not go away; we would just be dependent on Saudi oil instead of oil from various other nations.\n\nThe discussions have now reached the final phase. Do we accept or reject the oil deal?"
 saudi.36.a: "It is a pleasure."
 saudi.36.b: "The deal is not worth it..."
 saudi.37.t: "Fahd bin Turki Arrested Over Coup Collaboration"
 saudi.37.d: "General Fahd bin Turki has been arrested over suspicion that he collaborated with the traitors who tried to overthrow our Government. The evidence is stacked against him, as the General Intelligence Presidency has found photographic proof showing him directly talking with the leader of the coup.\n\nThe trial will begin soon as we are still uncovering new evidence. It is obvious that he will get the death sentence, but the method of his execution will be determined by the Saudi Supreme Court.\n\nFahd bin Turki himself rejects most evidence and claims that he is innocent and was 'forced' and 'blackmailed' into supporting the coup. Though there is a small chance he is not lying... his fate will not be changed..."
 saudi.37.a: "Give me a Ticket to his execution!"
 saudi.39.t: "Fahd bin Turki Breaks Out of Prison"
 saudi.39.d: "Shocking news has come out of Al-Ha'ir Prison, 25 km south of Riyadh, as an attack helicopter stolen from the SSF's headquarters attacked and overran our Prison Directory's Garrisons, freeing most inmates including Fahd bin Turki. This is a nation-wide embarrassment as the man who helped organize the coup that caused the civil war is not only free, but on the enemy's side. While there is nothing we can do right now, if we get the chance to capture him, we will do so without a single second of hesitation.\n\nHE WILL PAY AND HE WILL SUFFER FOR THE CRIMES HE COMMITTED AGAINST US AND ISLAM."
 saudi.39.a: "We will boil that bastard alive when we get him and turn him into FUCKING KABSA!"
 saudi.40.t: "Saudi Economy Collapses"
 saudi.40.d: "FROM: Economic Minister Mohammed Al-Tuwaijri\nTO: ( REDACTED )\nDATE: [GetDateText]\nABOUT: The economic collapse following the loss of all coastline.\n\n\n\nDespite all attempts by our army to defend the town of Qatif, Qatif still fell to Sponsored proxies, and with that we lost our entire connection to the coast; now we are unable to export even a single barrel of oil.\nBecause of that, the Saudi economy has completely collapsed into chaos as the monetary supply that had been continuously flowing since the first discovery of oil has been cut off completely.\nCurrent economic growth has been estimated to be -35%, if not worse.\n\n§RWE NEED TO REGAIN CONTROL OF AL-SHARQIYA AS FAST AS POSSIBLE IF WE WANT TO PREVENT A TOTAL COLLAPSE OF OUR NATION§!\nNew data shows ( REDACTED ) is still ( REDACTED ). There are many ( REDACTED ) on the side of Hezbollah Al-Hejaz and we could use them to regain the City of Qatif. The survival of the entire Saudi nation depends on this; we cannot allow any mistakes.\n\nEND OF REPORT"
 saudi.40.a: "As if it couldn't get worse..."
 saudi.41.t: "Future of the Kingdom"
 saudi.41.d: "We have come to the realization that reform in some shape or form will be necessary in order to prevent the failures of 2020. The shape and size of the reforms are currently under heavy discussion within the House of Saud.\n\nThis decision will decide the future of the Kingdom of Saudi Arabia; we cannot allow ourselves any mistakes or show any weakness.\nNo matter what is decided, we will endure and show our enemies why they will regret their decisions once they are defeated and decimated.\n\nNever forget, we are on the right side of history!"
 saudi.41.a: "For a Great Saudi! 2030!!!."
 saudi.41.b: "The status quo remains."
 saudi.42.t: "Another Purge"
 saudi.42.d: "Sadly, it looks like our 'peaceful' measures have failed to cleanse the army and other bodies of government of disloyalty. With more and more evidence being uncovered about additional traitors, we can confidently launch a small-scale purge to finally clean our own ranks.\n\nWhile it's going to hurt, luckily most of the people affected are lower-ranking officers and ministers, as well as some city mayors. With them dealt with, the General Intelligence Presidency can focus on the traitors hiding in the shadows: the Liberals, Hezbollah, and a few remaining traitor princes who went under the radar.\nHopefully this will be enough to stop the growing violence and resistance against the House of Saud."
 saudi.42.a: "Rot in hell."
 saudi.43.t: "Saudi Constitution: Question of Women's Rights"
 saudi.43.d: "One hot topic of the new Saudi Constitution is the question of women's rights, as they have been 'lagging behind' compared to other Middle Eastern nations. We could improve women's rights to at least somewhat equal levels to men's rights, or we could just leave them as they are."
 saudi.43.a: "Isnt what we gave them enough!?"
 saudi.43.b: "I mean, we could use some tiktok recognition.."
 saudi.44.t: "Question of Freedom of Speech"
 saudi.44.d: "Another great topic of debate is the question of freedom of speech. With many haughty statements being made, shall we allow some forms of freedom of speech or not?"
 saudi.44.a: "What's so bad about freedom of speech?"
 saudi.44.b: "Freedom of speech, yes. Freedom after speech? Hmmph."
 saudi.45.t: "Importance of the Quran in the Constitution"
 saudi.45.d: "The Holy Quran has been the foundation of almost all our laws before the writing of the constitution, which is why we need to clearly state how much influence the Quran will have on laws inside our new constitution."
 saudi.45.a: "It shall be the foundation for ALL laws."
 saudi.45.b: "It shall remain an important pillar for most legislation."
 saudi.45.c: "It shall be restricted strictly to religious and family law."
 saudi.46.t: "Finishing Touches"
 saudi.46.d: "After weeks of intense debate, drafting, and political maneuvering, the final draft of the brand-new Saudi Constitution is nearing completion. This represents a monumental shift for the future of the Kingdom.\n\nIn a few days, the document will be formally ratified and presented to the public."
 saudi.46.a: "It's perfect."
 saudi.46.b: "It's... acceptable."
 saudi.47.t: "End of COVID-19"
 saudi.47.d: "Through strict public health measures and a widespread vaccination drive across all provinces, the Kingdom has successfully curbed the spread of the COVID-19 virus. Daily life is returning to normal, and the threat of another nationwide lockdown has vanished."
 saudi.47.a: "A moment of silence for those we lost..."
 saudi.48.t: "Election Results"
 saudi.48.d: "With the polls officially closed and the ballots counted, the official results have been published: Crown Prince Mohammed bin Salman has secured a staggering, almost unanimous victory. International observers are... expectedly silent."
 saudi.48.a: "We won with 147% of the vote! Democracy at its finest!"
 saudi.48.b: "A modest 99.9% will keep the critics happy."
 saudi.49.t: "Flowers Bloom Even During Fire"
 saudi.49.d: "Even in the dire of times, growth is something that exsists, and will exsist Forever. Flowers will bloom, no matter how salted the ground is."
 saudi.49.a: "A Spark of Hope"
 saudi.50.t: "EU-Saudi Oil Accord"
 saudi.50.d: "Crippled by energy shortages and desperate to decouple from Russian gas, the European Union has turned its eyes toward Riyadh. Following intense negotiations in Brussels, European financial institutions have agreed to underwrite a comprehensive economic recovery package for the Kingdom. In exchange, Saudi Arabia will guarantee a 20% discount on raw crude exports to EU member states. A monumental diplomatic victory."
 saudi.50.a: "The green line goes up once more."
 saudi.51.t: "Riyadh-Moscow Energy Pact"
 saudi.51.d: "Desperate times demand pragmatic diplomacy. Despite our volatile past with Moscow, a Saudi economic delegation flew to Russia to secure a lifeline. Unexpectedly, the Kremlin agreed to underwrite our sovereign debt in exchange for a guaranteed 20% discount on crude exports and market coordination within OPEC+. Our economic bleeding has finally been stemmed."
 saudi.51.a: "A deal with the devil, but a necessary one."
 saudi.53.t: "Saudi Request for Military Aid"
 saudi.53.d: "The legitimate government in Riyadh has dispatched an emergency diplomatic envoy, requesting immediate small arms shipments and munitions to turn the tide against rebel forces in Arabia."
 saudi.53.a: "Approve the shipments immediately."
 saudi.53.b: "We have no interest in getting involved."
 saudi.54.t: "Paris Rejects Arms Request"
 saudi.54.d: "The French government has formally rejected our request for military hardware, citing international instability and non-intervention policies. Bureaucrats in Paris would rather watch the Middle East burn than sell us basic munitions."
 saudi.54.a: "Go to Hell."
 saudi.55.t: "France Approves Arms Shipments"
 saudi.55.d: "In a surprising move, Paris has authorized emergency defense sales to Riyadh. Crate after crate of MATIS missiles and FAMAS rifles are arriving at our military airbases."
 saudi.55.a: "An unexpected favor from Paris."
 saudi.56.t: "Saudi Request for Military Aid"
 saudi.56.d: "Envoys from the House of Saud have arrived with an urgent petition for emergency defense material and heavy artillery to secure key urban centers."
 saudi.56.a: "Send the equipment."
 saudi.56.b: "Deny the request."
 saudi.57.t: "Moscow Refuses Assistance"
 saudi.57.d: "The Kremlin has cold-shouldered our diplomatic delegation, refusing to sell modern weaponry or supply parts to the Royal Saudi Armed Forces, Damm Russian imperialists!"
 saudi.57.a: "Let us turn toward Western suppliers then."
 saudi.58.t: "Moscow Authorizes Military Hardware"
 saudi.58.d: "Russian transport aircraft loaded with small arms, ATGM systems, and military hardware have begun landing at our airbases. Moscow has chosen to back our regime."
 saudi.58.a: "Their support will not be forgotten."
 saudi.59.t: "Saudi Request for Military Aid"
 saudi.59.d: "Delegates from the Saudi government have approached our administration requesting emergency military aid and logistical assistance."
 saudi.59.a: "Authorize the aid package."
 saudi.59.b: "Refuse to intervene."
 saudi.60.t: "Beijing Rejects Arms Supply"
 saudi.60.d: "China has formally declined to authorize military equipment transfers, preferring to maintain strict diplomatic neutrality regarding Arabian internal affairs."
 saudi.60.a: "Go Wassup your Beijing, Xi."
 saudi.61.t: "Beijing Delivers Arms Package"
 saudi.61.d: "China has answered our call. Transport ships carrying heavy infantry equipment, drones, and armored vehicles have begun docking under heavy escort."
 saudi.61.a: "A powerful ally in our hour of need."
 saudi.63.t: "Triumph in the Civil War"
 saudi.63.d: "The sound of gunfire across the Peninsula finally falls silent. After months of devastating conflict, brother against brother, the rebellion has been crushed and order restored. Reconstruction will take years, but the authority of the Crown remains absolute.\n\nOutside the Royal Palace in Riyadh, over 150,000 citizens gathered as King Mohammed bin Salman stepped onto a grand podium to address the nation. As a low-altitude formation of RSAF Eurofighter Typhoons and F-15SAs thundered over the royal quarter, the crowd erupted into deafening cheers. The war is won, but the wounds of the Kingdom run deep."
 saudi.63.a: "We won... but at what cost?"
 saudi.64.t: "The Insurgency Awakens"
 saudi.64.d: "Though their field armies have been shattered, pockets of die-hard rebels and rogue officers have hidden their arms. Reports are flooding in of asymmetric insurgent attacks popping up across outlying provinces."
 saudi.64.a: "Root them out, down to the last man!"
 saudi.65.t: "The Fate of Jordan"
 saudi.65.d: "Having brought the Hashemite Kingdom under our military control following their refusal of our diplomatic terms, we must decide the administrative future of the territory."
 saudi.65.a: "Maintain direct military administration."
 saudi.65.b: "Establish a loyal client state in Amman."
 saudi.66.t: "Saudi Arabia Invites Us to Join PSF"
 saudi.66.d: "Riyadh has issued a formal invitation for our nation to join the Peninsula Shield Force military pact, promising economic protection and military guarantees."
 saudi.66.a: "We accept their protection."
 saudi.66.b: "We refuse to become Saudi puppets!"
 saudi.67.t: "Jordan Joins the Peninsula Shield Force"
 saudi.67.d: "Our Jordanian neighbors have accepted our diplomatic proposal, integrating their armed forces into the Peninsula Shield Force command framework."
 saudi.67.a: "Arabian security grows stronger."
 saudi.68.t: "OPERATION MAHANNA: Invasion of Jordan"
 saudi.68.d: "With all peaceful avenues to secure Jordan's entry into the Peninsula Shield Force exhausted, military command has authorized Operation Mahanna. Armored columns are crossing the border to enforce regional integration by force."ther choice than to invade Jordan and politely ask them again if they want to join."
 saudi.68.a: "Special Military Operation: 3 days to Amman."
 saudi.69.t: "The Fate of Iraq"
 saudi.69.d: "With Iraqi forces routed and Baghdad under total coalition occupation, the political destiny of Mesopotamia rests in our hands. To prevent a protracted sectarian insurgency, we must rapidly establish an administrative apparatus loyal to the Crown."
 saudi.69.a: "Establish a loyal client state in Baghdad."
 saudi.70.t: "The Shadow of War Exhaustion"
 saudi.70.d: "The campaign against Tehran was a total military victory, but the price in blood and logistics was immense. Supply lines across the Zagros Mountains are stretched to their limits, hyperinflation is creeping into our domestic markets, and thousands of families across the Kingdom are burying their dead."
 saudi.70.a: "Iran is ours... but at what cost?"
 saudi.71.t: "The Fall of Jerusalem: Israeli Surrender"
 saudi.71.d: "Following the fall of Jerusalem to the Royal Saudi Armed Forces and allied coalition units, Benjamin Netanyahu met King Mohammed bin Salman in Ankara under international oversight to sign a formal instrument of surrender.\n\n=============================================\nSAUDI-ISRAELI PEACE TREATY (ANKARA ACCORDS)\n=============================================\n1. Dissolution of the Ethnostate: Likud, Shas, United Torah Judaism, and Otzma Yehudit are permanently banned. The Israeli political framework is abolished.\n2. Secular Levantine Federation: Formation of a single democratic state incorporating all Jews, Arabs, and Christians under equal representation within the newly established Levantine Council.\n3. Mandatory Reconciliation: The Federation shall remain strictly secular. Immediate desegregation mandates shall take effect within 30 days of ratification.\n4. Nuclear Disarmament: The immediate and complete surrender and dismantling of all Israeli nuclear warheads under international supervision.\n5. Military Dissolution: The IDF and Mossad are disbanded. High-ranking officials shall face tribunal trial for war crimes. Defense guarantees will be maintained directly by the Peninsula Shield Force.\n=============================================\n\nSIGNATURES:\nISRAEL: B. NETANYAHU                     SAUDI ARABIA: MBS"
 saudi.71.a: "A new era for the Levant!"
 saudi.71.b: "NO! Israel will be destroyed! §R(THIS WILL LEAD TO UNIMAGINABLE CONSEQUENCES)§!"
 saudi.72.t: "THE SAMSON OPTION"
 saudi.72.d: "Refusing to accept total subjugation, rogue Israeli commanders activated the ultimate contingency. Silos opened across the Negev. Command relays went dark as nuclear warheads detonated over advancing coalition formations and major regional centers....................................................................................................................................................................................................................................\n\nRadio Silence."
 saudi.72.a: "...May God have mercy on us all."
 saudi.73.t: "Victory in the Levant"
 saudi.73.d: "The impossible has been achieved: a complete military victory in the Levant. The Israeli war machine has been disarmed, and its leadership faces international tribunals. As Allied stabilization forces enter Jerusalem, a fragile peace settles over Palestine after decades of bloodletting."
 saudi.73.a: "Palestine is finally free."
 saudi.74.t: "Blockade of Hormuz Broken"
 saudi.74.d: "Following decisive naval engagements in the Persian Gulf, the Royal Saudi Navy and allied task forces have shattered the Iranian anti-ship missile network and coastal naval forces. Commercial tankers can now traverse the Strait of Hormuz without threat of interdiction."
 saudi.74.a: "Those Naval edits now are 10x Better."
 saudi.75.t: "Strait of Hormuz Remains Sealed"
 saudi.75.d: "Despite heavy naval sorties, Iranian anti-ship missile batteries along the coastal cliffs of Hormozgan have repelled our fleet. With maritime trade choked, our only path forward is a grueling overland march into the Iranian heartland."
 saudi.75.a: "A nightmare in the Zagros awaits us..."
 saudi.76.t: "The Fate of Iran"
 saudi.76.d: "Tehran has fallen, and the Islamic Republic is no more. With a vast, ethnically diverse country under our military occupation, we must establish a central government capable of maintaining basic public services while keeping regional separatist movements under control."
 saudi.76.a: "Form a loyal Persian government in Tehran."
 saudi.78.t: "Egyptian Mobilization Detected"
 saudi.78.d: "Classified intelligence reports from the General Intelligence Presidency confirm the worst: Egyptian military build-ups in the Sinai are not defensive maneuvers. Cairo is preparing an offensive coalition aimed directly at curbing Saudi dominance over the Arab world.\n\nOne final war to decide who leads the Arab world..."
 saudi.78.a: "Sisi Senpai won't do Shit.."
 saudi.79.t: "Unusual Egyptian Naval Maneuvers"
 saudi.79.d: "The Red Sea is completely filled with Egyptian naval vessels... the only explanation we have is that they are preparing a naval invasion... we need to garrison the west coast IMMEDIATELY."
 saudi.79.a: "The clock strikes 12."
 saudi.81.t: "Arab League Kicked Us Out!"
 saudi.81.d: "We're Not Arabs! We're, Something!"
 saudi.81.a: "To hell with you, traitors!"
 saudi.82.t: "Fate of the Hezbollah Terrorists"
 saudi.82.d: "With the militant networks dismantled and their safehouses raided across the Eastern Province, the leadership of Hezbollah Al-Hejaz has been rounded up. We must decide the final punishment for these sectarian subversives."
 saudi.82.a: "The verdict: death by stoning!"
 saudi.83.t: "Fate of the Dissidents"
 saudi.83.d: "The urban liberal opposition and radical student movement ringleaders have been captured following the collapse of the northern rebellion. How shall we deal with these Western-backed agitators?"
 saudi.83.a: "Give 'em all beheadings."
 saudi.83.b: "Let them Rot in a Mabahith Jail.. They'll pray for their heads sliced."
 saudi.84.t: "Fate of the Remaining Traitors"
 saudi.84.d: "The last of the rogue military officers and high-ranking conspirators who fled underground have finally been tracked down by the GIP. The internal cleanup of the Kingdom is reaching its final, bloody conclusion."
 saudi.84.a: "Kill 'em all!"
 saudi.85.t: "China-Saudi Oil Deal Signed"
 saudi.85.d: "After Xi Jinping met with King Mohammed bin Salman in Riyadh to discuss the oil deal, we have good news to tell, as China signed the full oil deal with us!"
 saudi.85.a: "Good."
 saudi.86.t: "Oil Deal with China Fails"
 saudi.86.d: "Despite our attempts to convince China to sign the deal, China refused. We have to look to other countries if we want to make a new oil deal..."
 saudi.86.a: "Damn it!"
 saudi.87.t: "Fahd bin Turki Captured Alive!"
 saudi.87.d: "The greatest traitor in the entire history of Saudi Arabia has been captured alive! After his breakout from prison we thought we would never find him, but we were wrong! His execution is set in three days; the method of execution will be by stoning. May he rot in hell."
 saudi.87.a: "The last traitor, gone!"
 saudi.89.t: "Unification of Arabia"
 saudi.89.d: "From the shores of the Red Sea to the mountains of Oman and the plains of Mesopotamia, the Arabian Peninsula and its surrounding lands are united under one sovereign banner. The fractures of civil war have been sealed by iron and will."
 saudi.89.a: "Watani, WATANII!"
 saudi.92.t: "We have done it..."
 saudi.92.d: "Hey bro, why no description ):"
 saudi.92.a: "The Islamic world is one again"
 saudi.94.t: "He Would be Proud"
 saudi.94.d: "Many years have now passed ever since the start of the civil war, as we were at our lowest... defeat seemed inevitable, Mohammed bin Salman stood alone on his knees inside the Al Rajhi Mosque in the middle of the night, he closed his eyes and started praying... for God to hear him and the Saudi people, to ask if he had sinned, or if there was hope of salvation or victory for him and the Saudi people... during the prayer he felt the presence of God, as strong as never before in his life... while he couldn't hear the Lord speaking, his simple presence made his worries liquidate, he not only felt determined to save Saudi Arabia from collapse, he also felt a sense that HE was chosen to be the savior of the Arab People, HE was chosen to be the Lord's next Liberator to bring Saudi Arabia back together.\n\nPerhaps it was true... Under Bin Salman's leadership, a new wave of reconquest began, not seen since the 6th century, the enemies of Arabia disintegrated. The Houthis, Iraq, Syria, Iran, Israel, and Egypt were beaten by the unstoppable Saudi Army, led by the Greatest Islamic King since the conquests of the Ottoman Empire or perhaps even the best King since the arrival of Prophet Mohammed Himself. Or maybe he was just lucky? No! He was destined to be the sword of God.\n\nFollowing the weeks of celebrations of Arab Unification, Bin Salman decided to give himself a day of rest, telling his advisors he was on a business trip. Bin Salman drove alone at night to the never-ending Saudi desert. He walked to the highest sand dune he could see and laid down, looking at the clear night sky. Thinking about the never-ending successes, 'My father Abdulaziz could never have thought we would make it so far... but now from heaven he is smiling, being proud of my achievements...'"
 saudi.94.a: "Look Jaddi, I made it this far..."
 saudi.97.t: "Evening on the Corniche"
 saudi.97.d: "Al-Shati District, stretching along the quiet waters of the Dammam Corniche, is blanketed in a heavy, humid silence today. The rows of palm trees and concrete roads, once crowded with sunset crowds and the laughter of many, are now coated by broken-down checkpoints and the tread-marks of M1 abrams.. There are no celebratory flags waving, only the rumble of a distant tank patrol cutting across the dark waters of the Gulf and the sharp snap of salt-bleached flags in the wind.. From afar, The solemn military escort advances down the coastal boulevard, draping the palm-lined avenue in green. Every face in the small gathering of waiting relatives bears a grim, unyielding expression. At the head of the procession march two senior officers from the RSLF Central Command, flanked by an honor guard carrying a flag-draped wooden case resting atop a cushioned bier.. "People of al-Sharqiya, we return to you Sergeant Tariq bin Faleh," the captain calls out, his voice cracking slightly against the offshore breeze. A tight crowd forms, making a path through the concrete roadblocks. An elderly mother, leaning heavily on her youngest son's arm, takes slow, trembling steps forward. As she reaches the edge of the bier, She collapses against the draped wood, burying her face in her hands as her shoulders shake with silent grief, whispering into the air..
 saudi.97.a: "Welcome home, my son. Our city is safe now."
 saudi.98.t: "Morning in the Interior Building"
 saudi.98.d: "The upper floors of the Ministry of Interior headquarters in Riyadh are silent, with the low, constant hum of heavy-duty paper shredders and the blue glow of CRT monitors. Outside the reinforced glass, the morning sun is just beginning to slap the concrete expanse of the capital a blinding white, but inside, the clock stopped caring about daylight hours days ago. Desks are piled high with red-stamped emergency dossiers, intercepted border reports from the Eastern Province, and uncollated loyalty assessments of regional commanders. A mid-level director stands by the window with a lukewarm paper cup of Arabic coffee, watching a convoy of black security SUVs weave through the concrete barricades below. The telephone on his desk rings, a secure, encrypted line that has only brought bad news since the crisis began. He lets it ring three times before picking it up."
 saudi.98.a: "Ministry. Speak."
 saudi.99.t: "interfering in Lebanese Elections"
 saudi.99.d: "With the Lebanese election season being now in full swing, an opportunity has presented itself to get our pro saudi chandidate into office."
 saudi.99.a: "Understood"
 saudi.100.t: "Laury Haytayan wins Lebanese elections"
 saudi.100.d: "Despite all odds, our pro saudi candidate Laury Haytayan has won the recent 2025 Lebanese elections!, with Lebanon now in our sphere of influence, we can continue to spread pro Saudi sentiment all over the Middle East"
 saudi.100.a: "A great victory"
 saudi.101.t: "Dear Player..."
 saudi.101.d: "Thank you so much for playing TFR Arabia Burns!, this is my first ever mod, i hope you enjoyed playing it, as much as i and the dev team had developing it. (:"
 saudi.101.a: "Fare well - TFR Arabia Burn Dev Team"
 saudi.102.t: "Empty Palaces"
 saudi.102.d: "Inside the towering glass-and-steel monolith of the GCC General Secretariat on King Fahd Road in Riyadh, the multinational conference halls are eerily silent. Designed to project decades of pan-Gulf economic integration, unified customs unions, and joint defense pacts, the complex now resembles a ghost of regional diplomacy. The massive digital electronic boards in the main hall, once programmed to display live trade indexes, currency metrics, and joint military deployments, flicker erratically before cutting to black. In the executive briefing rooms, national delegations from gulf capitals have long since packed up their encrypted laptops and evacuated their embassies, leaving behind empty coffee cups and scattered emergency documents. An aging clerk walks down the deserted, carpeted corridors, pulling the heavy oak doors shut on empty committee rooms where the fate of a fractured peninsula was supposed to be harmonized."
 saudi.102.a: "Obvious, No?..."
 saudi.103.t: "A Stroll through al-Tamimi"
 saudi.103.d: "The fluorescent lights of the al-Tamimi supermarket hum with an irritating, sterile brightness, casting a pale glow over aisles that are half-stripped of their stock. A few shoppers push heavy carts past towering stacks of bottled water, canned goods, and long-life milk, the universal currency of a populace bracing for the worst. Outside, the midday heat shimmers off the ground, but inside, the ACs are cranked to a bone-chilling temperature. A young man stands frozen in front of the empty coffee shelf, a single half-empty basket in hand, listening to the muffled, overlapping chatter of local news anchors playing from a small radio behind the checkout counter. Rumors are spreading faster than official bulletins: roadblocks on the northern ring road, ration tokens being printed, and the quiet exit of families heading toward the border. He reaches out, picks up a box of dates out of sheer habit, and puts it back down."
 saudi.103.a: "Dear Allah.."
 saudi.104.t: "The Najrani Standard"
 saudi.104.d: "REPORT: Staff Sergeant Fahad Al-Dossary, 4th Armored Brigade, Royal Saudi Land Forces.The roar of the Abrams engine vibrated through the hull as the tank battalion ground its way through the dust and jagged hills of the Najran border post. Outside the machine, the heat was suffocating, thick with the smell of diesel, spent MG bullets, and burning rubber. Ahead of them, F15s fighters banked low through the valley, leaving trail lines of white smoke before rumble after rumble shook the canyon walls.\n\nFor months, Fahad’s crew had watched the border in uncertainty while reports of purges and unrest filtered down from army gossip. Now, all focus was pointed south. The command over the headset was unyielding, with reports of to only advance.\n\nAs the armor cleared the rise and looked down into the Houthi-controlled valleys below, small-arms fire rattled harmlessly off the side plating. Fahad tightened his grip on the commander’s hatch rim. The border posts were behind them now. The Kingdom was stepping directly into the fires of Yemen once again, but this time, there would be no turning back until the entire south was brought to Its knees."
 saudi.104.a: "Dont tell Mom iam in Najran..."
 saudi.105.t: "Echoes Over the Khaleej"
 saudi.105.d: "REPORT: Captain Faisal Al-Otaibi, 92nd Squadron, Royal Saudi Air Force."Flares! Break left, break left!" his WSO yelled over the intercom as Faisal slammed the stick hard, pulling eight Gs while punching off a salvo of white decoy flares into the damp air. Behind them, the massive silhouette of an Iranian F-14A Tomcat roared out of the clouds, its afterburners scorching the sky as a Phoenix missile streaked past their canopy by a mere hundred meters, detonating harmlessly into the sea below.\n\nFaisal didn't give the Iranian pilot time to strike again. Slicing through the slipstream, he inverted the F-15SA, pulled the nose violently back onto the Tomcat's tail, and locked the joint helmet-mounted cueing system onto the F-14A's exhaust.\n\n"Fox Two!"\n\nAn AIM-9X Sidewinder snapped off the wingtip, turning on a dime in a streak of scorching smoke. The missile slammed directly into the Tomcat's left engine, tearing the aging giant apart in a blinding orange fireball that scattered debris across the Gulf.\n\nFaisal leveled the Eagle, watching the surviving Iranian wingman turn tail and bolt back toward Bushehr. The skies over the Gulf belonged to the Saudis, but as he dialed in the vector back to King Abdulaziz Air Base, he knew the real war had only just begun."
 saudi.105.a: "First Blood"
 saudi.106.t: "Hormuz is Secured!"
 saudi.106.d: "Through a coordinated campaign of carrier-based strikes, heavy minesweeping operations, and anti-ship missile spam, Royal Saudi Naval Forces and regional PSF marines have neutralized the anti-access/area-denial network along the Strait of Hormuz. Iranian coastal missile batteries, midget submarine pens, and fast-attack swarm craft positions at Bandar Abbas have been systematically annihilated or suppressed. Tankers and international merchant vessels have begun transiting the narrow choke point under Royal Saudi Navy escort once again, restoring the primary artery of global energy commerce and dealing a devastating blow to Iran's leverage."
 saudi.106.a: "perhaps we overestimated the Iranians..."
 saudi.107.t: "Choked at the Strait"
 saudi.107.d: "The offensive into the Strait of Hormuz has descended into a tactical disaster. A combination of dense Iranian naval minefields, shore-based anti-ship cruise missile batteries, and coordinated suicide drone swarms has decimated coalition escort screens pushing toward the Narrows. Multiple Saudi frigates and commercial tankers lie burning or sunk in the shallow waters, forcing high command to order a humiliating withdrawal back into Khafji's port. With the waterway effectively impassable, global energy markets are in for a treat, and international pressure on Riyadh to accept a ceasefire is reaching a fever pitch."
 saudi.107.a: "An humiliatinon"
 saudi.108.t: "Tying loose ends"
 saudi.108.d: "One month has passed since the collapse of the Houthi government, and yet our intervention in Yemen has not yet ended.\n\nThe final offensive against the Houthis has been put into full swing. After more than 6 hours of Saudi-Yemeni artillery bombardment and airstrikes on Houthi possitions, the Yemeni 30th Special Forces brigade began their push into Al-Mahabishah, a critical town located on high elevation, supported by the 5th Saudi Army made up of 12 Divisions from the north.\n\nHouthi resistance was more fierce than expected, with the 5th and 20th Yemeni Divisions being repelled from taking Al-Mahabishah. following the succses of the Saudi Army being able to capture Ibn Abbas and most of the Houthi-controlled coastline, the remaining Houthi troops were running out of supply and food.\n\nDespite most of the Houthi army having surrendered 2 weeks into the offensive, the brutal fighting and siege of Al-Mahabishah continued, house to house fighting, suicide attacks, booby traps, the Houthis had nothing left to lose and sought to drag as many Saudis and Yemeni soldiers into the ground as possible. After most of the city itself fell, the remaining Houthi soldiers retreated into the high mountains around the town, but not long after, almost all Houthis surrendered to the Saudi Army, but the Saudis had no plans of taking in Houthi *Terrorists*, so came the order over the radio."
 saudi.108.a: "Take no prisoners!"
