 ISR_figthing_Untill_the_Bitter_end: "Fighting untill the bitter end"
 ISR_figthing_Untill_the_Bitter_end_desc: "This is the darkest hour in Jewish history ever since the barbaric arab invasion of israel in 1947, we will endure, we have to..."
 ISR_iran_israel_war: "Iran Israel War"
 ISR_iran_israel_war_desc: "clash of civilisations"
 SAU_Saudi_Lebanese_cooperation: "Saudi Lebanese cooperation"
 SAU_Saudi_Lebanese_cooperation_desc: "While it is an unfair deal, with Saudi Arabia getting huge influence over our economy, we need the Saudi investment money to stop the 3 decades of economic stagnation and decline that has crippled the Lebanese economy."
 SAU_Harded_Figthers: "Hardened Fighters"
 SAU_Harded_Figthers_desc: "Since 6 years has our army fought for the survival of the Yemeni state, despite our setbacks, defeats and betrayal by the UAE, our army has become a well oiled and experienced machine, being able to hold off Houthi and STC offensives with ease"
 SAU_Reliance_on_saudi_arabia: "Reliance on Saudi Arabia"
 SAU_Reliance_on_saudi_arabia_desc: "While it's always hard to admit it, the Yemeni State is completely dependent on Saudi military and economic aid. While we are grateful for their support, we must prevent Saudi Arabia from gaining too much influence over our Nation"
 SAU_Humanitarian_Hell: "Humanitarian Hell"
 SAU_Humanitarian_Hell_desc: "Yemen has been in one of the worst humanitarian crises ever since the start of the civil war. Malnutrition, famine, lack of education and healthcare, by early 2020 already more than 350,000 civilians have died due to famine or other causes related to the civil war. May God help the people of Yemen."
 SAU_effects_Yemen_stc_split: "Effects of the Yemen STC split"
 SAU_effects_Yemen_stc_split_desc: "Ever since the STC split off from the Yemeni government in 2017, many problems still haunt us ever since, with the Saudi blockade and total reliance on the United Arab Emirates, our army morale has been very low."
 SAU_The_clock_stikes_12: "The clock strikes 12"
 SAU_The_clock_stikes_12_desc: ""
 SAU_Aden_the_yemeni_life_line: "Aden, Yemen's Lifeline"
 SAU_Aden_the_yemeni_life_line_desc: "Despite the Saudi blockade, Aden has and is the Yemeni lifeline, with us controlling Aden we are able to import food and weapons faster than all other sides of the civil war"
 SAU_southern_stonghold_of_the_revolution: "Southern Stronghold of the Revolution"
 SAU_southern_stonghold_of_the_revolution_desc: "With the support of Iran, we have been able to spread the revolution into the Yemeni heartland. Even with Saudi Arabian and Israeli terrorism against us, we are not only holding out, but getting stronger with each passing day. We are waiting for the perfect chance to start our final offensive to liberate the oppressed people of Yemen once and for all!"
 SAU_War_Exaution_yemen: "War Exhaustion"
 SAU_War_Exaution_yemen_desc: "6 years of non-stop war have taken a heavy toll on the Yemeni army and people. But even against all odds, the Revolution is defending itself against degeneracy"
 SAU_yemen_Recovering_nation: "Recovering Nation"
 SAU_yemen_Recovering_nation_desc: "After so much Yemeni blood spilled... so much destrucktion... so much suffering, Yemen is at peace for the first time in a long time. Finally our broken nation and people have time to recover."
 SAU_Hamas_last_bastion_against_zionist_terrorism: "Hamas, last bastion against Zionist Terrorism"
 SAU_Hamas_last_bastion_against_zionist_terrorism_desc: "The Arab world has gone soft... betraying the palestian people once more, even the "Palestinian Liberation Organisation" have become slaves and pupets of the Zionists. But WE will not bow down against Zionist Genocide! we will figth for Palestine, figth untill the bitter end! The Zionists want to eraducate the Palestian people, BUT ONLY OVER OUR DEAD BODIES!!!"
 SAU_ruzzia_buff: "Against the collective West"
 SAU_ruzzia_buff_desc: "Its time Russians!, time free ourself from Western oppresion! GOIDAAAAAA!!!!!!!!!!"
