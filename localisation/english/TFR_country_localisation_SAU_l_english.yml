l_english:
 ###FOCUSES###
 SAU_Uneasy_20ies: "Uneasy '20s"
 SAU_Uneasy_20ies_desc: "The beginning of the 2020s marks an uneasy era for the Kingdom of Saudi Arabia. While our economic growth is declining, Godless Traitors and Liberal Retards have begun to plot against the Royal Family of Saud, may Allah protect us and give strength to us and the people of Saudi Arabia. But as long as our oil exports continue to flow, nothing bad can happen."
 SAU_Never_ending_oil_money: "Never-Ending Oil Money"
 SAU_Never_ending_oil_money_desc: "Ah yes, the black gold, the only reason why Saudi Arabia is as rich and powerful as it is now. Despite the oil reserves becoming ever smaller over the years, there are still many undiscovered oil fields just waiting to be found."
 SAU_A_Dis_United_kingdom: "A (Dis) United Kingdom"
 SAU_A_Dis_United_kingdom_desc: "Arabia faces 3 devils: Firstly, the biggest danger, the southern traitor princes and their private militaries. The southern part of Saudi Arabia has always been a hotspot for traitors due to the lack of surveillance from Riyadh. Secondly are the Libtards from inside and outside, trying to corrupt and gayify the Saudi youth, but due to our efforts, they are only able to hide in the northern deserts, like the pussies they are. And lastly, Iranian-sponsored Shia and Hezbollah terrorists; while the cells are small, they are the most violent, commiting Terrorist attacks directly sponsored from Teheran. We have to destroy all these traitors.\n§RIF NOT DEALT WITH, THE TRAITORS COULD CAUSE A COLLAPSE OF SAUDI ARABIA!§"
 SAU_EVRYTHING_IS_FINE: "§REVERYTHING IS FINE§!"
 SAU_EVRYTHING_IS_FINE_desc: "§RRemain calm, Arabia endures, there is much to be done§!..."
 The_Middle_Eastern_chess_game: "The Middle Eastern Chess Game"
 The_Middle_Eastern_chess_game_desc: "The three major Middle Eastern powers (Saudi Arabia, Israel, Iran) have been in a cold war for decades now, with all of them trying to get the edge over each other. We need to increase our involvement in local proxy wars if we want to stop the spread of Iranian and Israeli terrorism."
 SAU_Oil_now_Oil_foreever: "Oil Now, Oil Forever"
 SAU_Oil_now_Oil_foreever_desc: "In 30 years we will run out of oil or that's what the propaganda wants us to believe. Saudi Arabia's oil fields will NEVER END, so why should we decrease the production of our black gold?"
 SAU_Ending_the_oil_addiction: "Ending The Oil Addiction"
 SAU_Ending_the_oil_addiction_desc: "For far too long have we had to rely on oil, and we need to change that right now. If we are not able to diversify our economy before the oil runs out, it could lead to a civilisational collapse of our wonderful nation, so it's important that we never even get close to that point!"
 SAU_Subsedise_companys: "Subsidise Companies"
 SAU_Subsedise_companys_desc: "The easiest way to stimulate the economy is to simply inject money into our most important companies. It's really that simple."
 SAU_Infrastructure_epxanion: "Infrastructure Expansion"
 SAU_Infrastructure_epxanion_desc: "While our road network has massively grown in the last two decades, many rural places still have roads and highways that are in horrible condition. By massively expanding funding to the Ministry of Infrastructure, we hope that our road network can become the best in the entire Middle East."
 SAU_Build_Megaprojects: "Build Megaprojects"
 SAU_Build_Megaprojects_desc: "NEOM, The Line, Qiddiya, just to name a few projects that are currently being built. We have such a big surplus of money, so why not use it?"
 SAU_The_Growth_will_never_end: "The Growth Will Never End"
 SAU_The_Growth_will_never_end_desc: "Despite the effects of COVID, our economy has done the impossible and has begun to grow massively again. It is truly a miracle."
 SAU_Exploit_the_ground: "Exploit The Ground"
 SAU_Exploit_the_ground_desc: "While Saudi Arabia is most commonly known for its oil, we still have many major untouched steel, aluminum, and other rare minerals in our soil. With increased funding, we could dig out more rare minerals than oil in the near future."
 SAU_Expand_Army_Profesonalism: "Expand Army Professionalism"
 SAU_Expand_Army_Profesonalism_desc: "While we have one of the largest military spendings, with the best and most modern equipment in the whole Middle East, our Army's organisation and professionalism is mediocre at best. That's why it is necessary to greatly increase professionalism, because our modern weapons will be useless if nobody can use them."
 SAU_Military_Industrie_Expansion: "Military Industry Expansion"
 SAU_Military_Industrie_Expansion_desc: "Our Army is completely reliant on foreign equipment, that's why it is necessary to increase domestic gun production."
 SAU_Gather_Supports_From_the_Imams: "Gather Support From The Imams"
 SAU_Gather_Supports_From_the_Imams_desc: "The Saudi clergy has been the most important part of the Saudi government since ever the foundation of the Islamic Religion itself in the 5-6th century. Even if the clergy itself has barely any power, their complete support is a necessity to get. Working together with the most important Imams of Saudi Arabia, would skyrocket our legitimacy, putting all the traitors into the shade.\n\nWith major concessions for religious members, these concessions include army exemptions, as well as tax cuts and other minor benefits.\n\n§YNever forget, Allah is with us§."
 SAU_Keep_up_with_Western_Standars: "Keep Up With Western Standards"
 SAU_Keep_up_with_Western_Standars_desc: "All parts of the economy except the oil industry have started to lag behind Western standards, but by simply throwing money at the problem, it should 1000% just solve itself. Trust."
 SAU_crackdown_on_Libtards: "Crackdown On Libtards"
 SAU_crackdown_on_Libtards_desc: "Those evil gay L*berals have been a thorn in our side ever since their existence. The closest they came to overthrowing our government was in the 2011 Zionist and Iranian-Imperialist-sponsored Arab Spring, but those godless traitors stood no chance: they cried and then went home.\n\n§RBUT NOW THEY HAVE RETURNED, and they are stronger than ever§.\n\nAll necessary measures have to be put in place in order to save Saudi Arabia from falling into degeneracy.\nWhen we have dealt with them, we can focus on the other traitor princes and Iranian proxies."
 SAU_Focus_on_the_traitors: "Focus On The Traitors"
 SAU_Focus_on_the_traitors_desc: "While the Libtards are calling for an overthrow of our government, mostly they are unarmed. That's why we need to focus on the corrupt traitor princes first, as they are the biggest threat.\n\nThe situation has become so bad that they have begun buying their own paramilitaries. We cannot allow them to continue.\nIt's time to divide and conquer."
 SAU_delay_the_inevitable: "Delay The Inevitable"
 SAU_delay_the_inevitable_desc: "§RIt is now too little too late... we failed our people, ourselves... and even Allah himself... dark times are ahead.§"
 Sau_MORE_AID_FOR_YEMEN: "More Aid For Yemen"
 Sau_MORE_AID_FOR_YEMEN_desc: "While our intervention in Yemen has shown some victories, we need to make the Yemeni Army strong enough to be able to fight the Houthis themselves. This will be the biggest single arms delivery Yemen has ever seen."
 SAU_Libyan_Qestion: "Libyan Question"
 SAU_Libyan_Qestion_desc: "Which side in the Libyan civil war shall we support?"
 SAU_Spread_Saudi_culture: "Spread Saudi Culture"
 SAU_Spread_Saudi_culture_desc: "As the first Islamic nation of the world, our culture spans over 1500 years, promoting it to the youth of the world on social Media, would greatly improve the global view on our country positively."
 SAU_Investment_for_oil: "Investment For Oil"
 SAU_Investment_for_oil_desc: "Due to the ever so worsening of Russo-German relations, Germany has been fearing a major Economic crisis, would Russia cut the oil delivery, well we can use this as great opportunity, if we are successful at securing a deal with the German government, German companies would start moving their businesses into our city, greatly boosting our Economy. In Return we would export Saudi oil to Germany at a 20% discount.\n\nLet's just hope they say yes..."
 SAU_Xi_in_Rihyad: "Xi In Riyadh"
 SAU_Xi_in_Rihyad_desc: "Xi Jinping has always been a very... polarising figure to say the least... on the one hand China is a great investor and trading partner of Saudi Arabia, but on the other hand the Chinese influence over our country grew greatly in the last decade.\nBut nonetheless securing a new trade agreement would greatly benefit both of our nations."
 SAU_Improve_relations_with_Israel: "Improve Relations With Israel"
 SAU_Improve_relations_with_Israel_desc: "...while nobody wants to admit it, it is true that supporting Palestine is a lost cause, Israel by now has almost completely occupied most of Palestine, turning them into a rump state with no say. That's why we should at least try to warm relations with Israel, rather than to keep on supporting the sinking ship which is Palestine."
 SAU_stand_with_Palestine: "Stand With Palestine"
 SAU_stand_with_Palestine_desc: "We supported the Palestinian people since day one, and we will never stop supporting our Palestinian brothers... they have endured so much suffering under the joke of Zionist occupation and Imperialism, but now we will stop just watching and doing nothing, we will stand up directly for Palestine, for the first time since 1947.\n\nIf we are able to stop the illegal Zionist invasion and occupation of Palestine, we will show the world that we Arabs stand for our brothers, and do so forever more."
 SAU_the_virus_in_Arabia: "The Virus In Arabia"
 SAU_the_virus_in_Arabia_desc: "Sadly the newly discovered COVID-19 virus has been diagnosed in Saudi Arabia... We need to start immediate measures to prevent a further spread of the virus"
 SAU_Decleare_Total_Lockdown: "Declare Total Lockdown"
 SAU_Decleare_Total_Lockdown_desc: "The Virus has gone outside of our control, and has started ravaging Arabia... we need to declare a total lockdown to prevent a further spread of the Virus."
 SAU_Begin_Vaccine_Research: "Begin Vaccine Research"
 SAU_Begin_Vaccine_Research_desc: "Working together with the top scientists of the world, the creation of a Vaccine against COVID-19 is currently in full swing... Let's pray that it will be ready very soon..."
 SAU_Ease_the_lockdowns: "Ease The Lockdowns"
 SAU_Ease_the_lockdowns_desc: "We have done it, the pandemic is over.... but at what cost?, our king is dead and instability is skyrocketing... we don't know what's next...."
 SAU_crackdown_on_Rihyad: "Crackdown On Riyadh"
 SAU_crackdown_on_Rihyad_desc: "Riyadh and other territories have fallen into partial or full Anarchy, we need to restore order immediately, crackdown on all dissent, protests, and anti-government activities. We cannot allow the Traitors to take our lands for free! We will win."
 SAU_Keeping_the_Army_loyal: "Keeping The Army Loyal"
 SAU_Keeping_the_Army_loyal_desc: "Like if the defection of three quarters of our Army wasn't enough, many of our remaining soldiers and officers have begun to think about treason, that being to join the enemy side, we need to prevent and stop anyone that wants to betray the Kingdom, Bribes work the best with everyone that had those evil thoughts."
 SAU_Army_Reorganisations: "Army Reorganisations"
 SAU_Army_Reorganisations_desc: "While we have been able to Reduce the numbers of defections by over 90%, our Army is still a disorganised mess! even though an army reorganisation now would weaken us right now, it will greatly help us to victory in the future."
 SAU_Rely_On_Foren_Volenteers: "Rely On Foreign Volunteers"
 SAU_Rely_On_Foren_Volenteers_desc: "Sadly the Saudi Armed forces on their own will be unable to secure victory in this civil war, that's why we have to Rely on Foreign Volunteer armies. If we could convince our supporters into sending more troops, trucks, guns and food we could greatly improve our current position.\n\n§YLet's just pray that our enemies' supporters don't do the same§..."
 SAU_An_Saudi_Military: "A Saudi Military"
 SAU_An_Saudi_Military_desc: "While we appreciate all the support we are receiving, we rely on them, they could stop aiding any second if they don't see that we are able to win fast enough. We need to solely focus on improving the Saudi armed forces and their combat capabilities if we want to win this war."
 SAU_Future_of_the_Kingdom: "Future Of The Kingdom"
 SAU_Future_of_the_Kingdom_desc: "Saudi Arabia stands at a crossroads, we need to choose our future politics if we want to prevent such a tragedy as the civil war from ever happening again.\n\nEither we choose to start passing reforms, both cultural and economic, or we just keep everything as it is just rebrand, to create the illusion of reform and change.\n\nYou must choose, the future of Saudi Arabia will be written by this decision you make."
 SAU_Reform_is_Nesesary: "Reform Is Necessary"
 SAU_Reform_is_Nesesary_desc: "We are now facing the consequences of our own actions, our complete crackdown and refusal of all possible reforms allowed the traitors to build up enough strength. Never again will we let something like this happen, we need to reform, even if it will hurt, we will have to do at least the bare minimum..."
 SAU_Allow_Free_Political_Parties: "Allow "Free" Political Parties"
 SAU_Allow_Free_Political_Parties_desc: "To create the illusion of free choice and democracy, obviously we need to legalise some political parties and create some loyal ones ourselves. While these parties, to no one's surprise, will have no power and will be monitored 24/7. But people are retarded, they will see this change of allowing ""free"" parties and will believe we are finally becoming a free and democratic nation, and they will start supporting our government, but we will never become a libtard democracy, at least not in this universe."
 SAU_The_Status_Que_Foreever_more: "The Status Quo Forever More"
 SAU_The_Status_Que_Foreever_more_desc: "Well well well, why change if we can rebrand? Saudi Arabia will never reform, we will not cave in to Libtards and communist propaganda, we will never change, we will never become weak. Mohammed bin Salman will lead us to the future, even when the system will never change."
 SAU_Keep_the_Oil_exports_flowing: "Keep The Oil Exports Flowing"
 SAU_Keep_the_Oil_exports_flowing_desc: "Finally we are no longer landlocked, and now we can Finally export our oil again, this will end the total collapse of our economy. This is the first step toward victory.\n\n§Rwe will win this war, no matter what it will take§."
 SAU_Beg_for_Support: "Beg For Support"
 SAU_Beg_for_Support_desc: "Ammunition stockpiles are running out, we lack everything: Guns, trucks, tanks, EVERYTHING, we are slowly becoming desperate. We need to BEG for more military aid from our supporters."
 SAU_Blitz_true_thier_Lines: "Blitz Through Their Lines"
 SAU_Blitz_true_thier_Lines_desc: "The only strategy is offense, that's why we need to learn the proper doctrine and strategy of lightning warfare."
 SAU_Streangth_in_Numbers: "Strength In Numbers"
 SAU_Streangth_in_Numbers_desc: "We critically lack manpower, we need to focus on building a massive army, that way we will overpower all enemies, a 500 Million tank army will not do anything against a storm of flesh and blood."
 SAU_Domestic_Arms_Production: "Domestic Arms Production"
 SAU_Domestic_Arms_Production_desc: "The foreign aid isn't enough, if we don't build our own military factories, then we will never have enough guns to supply our units."
 SAU_Demonise_Iran: "Demonise Iran"
 SAU_Demonise_Iran_desc: "We need to talk about the truth about Iran, we need to show our people the horror of the Iranian regime"
 SAU_Destroy_the_Tratiors: "Destroy The Traitors"
 SAU_Destroy_the_Tratiors_desc: "Now that we have survived all of their offensives, it's time to counter attack ourselves... they will feel our rage... they will pay for every innocent Saudi murdered... for each millilitre of blood lost...\n\nthey will only regret their life decisions, when they will feel the barrel of justice pointed at their head... §Rin hell they will regret their decision even more."
 SAU_Building_an_Armored_Armata: "Building An Armoured Armata"
 SAU_Building_an_Armored_Armata_desc: "Modern battlefields demand overwhelming firepower and mobile armor capable of punching through enemy fortified lines. By mass-producing modern MBTs, upgrading existing mechanized infantry fighting vehicles, and establishing armored divisions, we construct a strike force designed to dominate the deserts and mountains of the Middle East.""
 SAU_Make_Them_Fear: "Make Them Fear"
 SAU_Make_Them_Fear_desc: "Give the traitors PTSD for life with our constant CAS bombardments!"
 SAU_Defenders_of_Islam: "Defenders Of Islam"
 SAU_Defenders_of_Islam_desc: "We will protect Islam all over our nation no matter the cost, the godless bastard will pay the final price for the blasphemy which they have committed, for each mosque they destroy, for each defenceless innocent life, they will pay. We will repay them with a bullet to the head."
 SAU_Decentrelise_the_command_Struckure: "Command Structure Decentralisation"
 SAU_Decentrelise_the_command_Struckure_desc: "The rigid, top-down bureaucratic hierarchy of our legacy military structure repeatedly proved to be a liability against fluid, modern asymmetric threats. By granting tactical autonomy to field commanders, streamlining real-time communication networks, and empowering junior officers to take the initiative on the front lines, we strip away red tape and build a modern, adaptable fighting force."
 SAU_Military_Research_Exposion: "Military Research Expansion"
 SAU_Military_Research_Exposion_desc: "War is the best motivator for the development of new military equipment after all, By expanding national military research initiatives, founding specialized defense academies, and funding domestic arms conglomerates like SAMI, we build an independent technological base capable of developing next-generation weaponry tailored specifically to our regional needs."
 SAU_One_Last_Offensive: "One Last Offensive"
 SAU_One_Last_Offensive_desc: "The Traitors are on their last legs! Finish them off, and bring them to justice for the crimes against humanity that they have committed!"
 SAU_End_the_Survaliance_State: "End The Surveillance State"
 SAU_End_the_Survaliance_State_desc: "The start of the civil war proves, that mass surveillance is not able to stop crimes, let alone the civil war itself. We will at least limit the surveillance by a little bit."
 SAU_Utelize_Mass_Propaganda: "Utilize Mass Propaganda"
 SAU_Utelize_Mass_Propaganda_desc: "Like Sun Tzu once said, true victory is only achieved when your enemy's armies give up out of fear by simply seeing your forces, we have seen mass propaganda work in Vietnam and many other proxy wars all around the globe.\n\nWe will break our enemies mentally, before they even shoot a single bullet. Every Saudi must sacrifice their life for the Saudi Vaterland if Necessary. We survived years of collapse, exploitation, foreign imperialism, so we will survive a simple civil war."
 SAU_Dominate_the_skyies: "Dominate The Skies"
 SAU_Dominate_the_skyies_desc: "Due to our enemies lacking an air force, if we are able to rebuild ours, we will greatly improve our chance of victory."
 SAU_Write_an_constetution: "Write A Constitution"
 SAU_Write_an_constetution_desc: "Saudi Arabia never had an actual "constitution", that doesn't mean that we had no laws, quite the opposite. Most laws are directly or indirectly influenced by the Holy Quran, but there are some problems with that... as the Saudi Arabian Kingdom entered the 21st century many of our laws are outdated, or unfit for the current time. That's why King Mohammed bin Salman decided to write a constitution, even though this constitution is mostly for show and will barely change any actual laws... or at least that's the plan."
 SAU_carrot_and_stick: "Carrot And Stick"
 SAU_carrot_and_stick_desc: "The carrot and stick policy has been used for over 3000 years already, and it's the easiest way to create the illusion of us actually doing something (despite we aren't), and they will believe it, just because we did the bare minimum, ahhh it's just too easy."
 SAU_No_Mercy_to_the_traitors: "No Mercy To The Traitors"
 SAU_No_Mercy_to_the_traitors_desc: "We cannot allow the traitors to get away with their crimes, even if they have not committed any, they will in the future, the Godless bastards are murderers, so why should WE show any mercy???"
 SAU_Arabia_weak_never_again: "Arabia, Weak Never Again"
 SAU_Arabia_weak_never_again_desc: "LONG LIVE MOHAMMED BIN SALMAN, GLORY TO THE KINGDOM OF SAUDI ARABIA, WE WILL NEVER BE WEAK AGAIN, GLORY TO VICTORY."
 A_Free_And_Fair_Referendum: "A ""Free"" And ""Fair"" Referendum"
 A_Free_And_Fair_Referendum_desc: "This """free""" election will decide the future of Saudi Arabia, the first election in Saudi history."
 SAU_To_Rule_1000_years: "To Rule 1000 Years"
 SAU_To_Rule_1000_years_desc: "All necessary "Reforms" have been done, we pretty much won the civil war, our newly oiled system will last 1000 years, if not until eternity."
 SAU_Forward_Arabia: "Forward Arabia"
 SAU_Forward_Arabia_desc: "Forward Arabia, we have done all Necessary Reforms, our support is through the roof, Mohammed bin Salman did the impossible, his reforms will prevent any mistakes from ever happening again."
 SAU_Trumph_in_the_civil_war: "Triumph In The Civil War"
 SAU_Trumph_in_the_civil_war_desc: "We have finally done it... total victory....\n\n§YThank you God, without your help we could have never done it.§"
 SAU_Emergency_factory_consersation: "Emergency Factory Conversion"
 SAU_Emergency_factory_consersation_desc: "We need to give up saving our Civilian industry, we need to completely focus on our Military Industry, we need the entirety of Saudi Society to work together, that way we will win."
 SAU_Bail_out_collapsing_Buisneses: "Bail Out Collapsing Businesses"
 SAU_Bail_out_collapsing_Buisneses_desc: "A collapse of the civilian industry would mean a total collapse of the entire industry, that's why we need to do everything in order to help our struggling civilian industry."
 SAU_Our_Exports_Secured: "Our Exports Secured"
 SAU_Our_Exports_Secured_desc: "We finally have control of all of the ports Necessary to export enough oil to sustain our people and Economy, we have done it, now we're a HUGE step closer to victory."
 SAU_diversify_our_economy: "Diversify Our Economy"
 SAU_diversify_our_economy_desc: "We will Finally stop the oil addiction, one step at a time"
 SAU_Kickstart_the_Military_Industry: "Kickstart The Military Industry"
 SAU_Kickstart_the_Military_Industry_desc: ""
 SAU_Help_Thoose_in_need: "Help Those In Need"
 SAU_Help_Thoose_in_need_desc: "The ones who have suffered the most in this war are the Saudi populace, that's why we have to do everything in our hands to protect and help our citizens."
 SAU_consesions_to_the_oligarcs: "Concessions To The Oligarchs"
 SAU_consesions_to_the_oligarcs_desc: ""
 SAU_Nationalise_Key_Industruies: "Nationalise Key Industries"
 SAU_Nationalise_Key_Industruies_desc: "While it is a bit S#cialist, it is a Necessary evil, after all we cannot allow these rich princes and businessmen to control almost 90% of our Economy."
 SAU_The_Weels_of_the_Economy_spin_once_more: "The Wheels Of The Economy Spin Again"
 SAU_The_Weels_of_the_Economy_spin_once_more_desc: "Months of civil unrest and non-stop fighting devastated trade networks, disrupted oil production, and choked supply chains across the Peninsula. Through aggressive state intervention, infrastructure repair, and targeted subsidies, normal economic activity has finally resumed. The refineries are operational, merchant shipping has returned to our ports, and the Kingdom's economic engine roars back to life."
 SAU_Flowers_Bloom_even_during_fire: "Flowers Bloom Even During Fire"
 SAU_Flowers_Bloom_even_during_fire_desc: "No matter how salted the ground, flowers will bloom no matter what."
 SAU_Meating_with_the_Bear: "Meeting With The Bear"
 SAU_Meating_with_the_Bear_desc: "The West has betrayed us, they are actively supporting the evil libtards. That's why it is the best decision to talk with the bear to secure a final Oil deal."
 SAU_Talks_with_the_west: "Talks With The West"
 SAU_Talks_with_the_west_desc: "The Russians are Fucking retarded, we cannot rely on the Russians who are just trying to steal and exploit our oil. That's why we need to start talks with the West, to finally make a major oil deal to finish our economic crisis."
 SAU_an_Rich_Mans_Dream: "A Rich Man's Dream"
 SAU_an_Rich_Mans_Dream_desc: "In order to fund the rapid expansion of our industrial base and high-tech defense sector, we must throw open the doors to global capital and domestic oligarchs. Special economic cities, tax exemptions, and deregulation will attract billions in private investment. While critics claim this wealth concentrates at the top, the massive capital influx fuels the heavy industrial machinery required to power the nation's future.\n\nTrickle down Economics always work, trust"
 SAU_Public_works_Programs: "Public Works Program"
 SAU_Public_works_Programs_desc: "Unemployment has reached over 36%, if this goes on soon half of our population will have no j*b. We need to start public works programs, in that way we can quickly build roads and buildings, while at the same time curbing our Unemployment."
 SAU_An_Peoples_State: "A People's State"
 SAU_An_Peoples_State_desc: "The old social contract between the absolute monarchy and the populace has evolved under the weight of national crisis. By implementing sweeping social welfare initiatives, subsidized housing programs, and expanded public services, we bridge the divide between government and citizen. We are ALL Social Democrats after all or something..."
 SAU_The_Saudi_Giant_Rises: "The Saudi Giant Rises"
 SAU_The_Saudi_Giant_Rises_desc: "Our Economy has risen from the ashes, an impossible miracle, that we have done. Glory to Saudi Arabia."
 SAU_Begin_Reconstucktion: "Begin Reconstruction"
 SAU_Begin_Reconstucktion_desc: "Our nation is in utter ruins from the brutality of the civil war. We have to start extensive nationwide Re-Building efforts to bring back our Nation to beauty once more."
 SAU_Returning_to_The_World_Stage: "Returning To The World Stage"
 SAU_Returning_to_The_World_Stage_desc: "Now that we have Reunified our nation, we have to look outwards again once more. We need to rebuild our sphere of influence and prevent Israel and Iran from spreading their influence and power."
 SAU_Whats_Next: "What's Next"
 SAU_Whats_Next_desc: "What's Next..."
 SAU_Evaluate_our_Military: "Evaluate Our Military"
 SAU_Evaluate_our_Military_desc: "Our Army is battered and tired, we need to start massive army Evaluation."
 SAU_Rebuild_Rual_Regions: "Rebuild Rural Regions"
 SAU_Rebuild_Rual_Regions_desc: "Rural Saudi Arabia has been hit the hardest in the civil war, that's why we need to do anything we can to help our rural and poorer population."
 SAU_create_the_Ministary_of_National_Reconstrucktion: "Create The Ministry Of National Reconstruction"
 SAU_create_the_Ministary_of_National_Reconstrucktion_desc: "In order to better organise the Rebuilding process, we need to create a temporary Ministry that is solely focused on the Reconstruction."
 SAU_Return_the_Migrants: "Return The Migrants"
 SAU_Return_the_Migrants_desc: "More than 2 Million People, if not more have migrated into other nations. That's why we have to try to bring as many of them back home."
 SAU_Rebuild_Mecca: "Rebuild Mecca"
 SAU_Rebuild_Mecca_desc: "Those Islamist Terrorists have caused major damage to the most holy city in Saudi Arabia, we need to do extensive repairs to restore Mecca to its former glory."
 SAU_Rebuild_Medina: "Rebuild Medina"
 SAU_Rebuild_Medina_desc: "Medina is one of the most destroyed cities, with over 70% of buildings being destroyed, we need to greatly increase funding for Reconstruction to rebuild Medina and all other cities and towns as fast as possible."
 SAU_Our_Future_looks_brigth: "Our Future Looks Bright"
 SAU_Our_Future_looks_brigth_desc: "Saudi Arabia has been rebuilt, bigger and better than ever before. We are in a new Islamic Golden Age! Now we can focus on our Army and foreign policy."
 SAU_Revive_the_Penninculare_defence_force: "Revive The Peninsula Shield Forces"
 SAU_Revive_the_Penninculare_defence_force_desc: "Following the collapse of Saudi Arabia, the Peninsula Shield Forces have been dissolved. But now that we're reunified again it's time to get the band back together."
 Prepare_for_the_great_Jihad: "Prepare For The Great Jihad"
 Prepare_for_the_great_Jihad_desc: "Final preparations are being made for the Great Jihad to liberate the Middle East from Iranian Theocratic Imperialism and Zionist Terrorism"
 SAU_Total_Mobilization: "Total Mobilization"
 SAU_Total_Mobilization_desc: "We need to get together all of our industry, to start building Military equipment for the Great Jihad."
 SAU_Toughfest_army_in_the_middle_east: "Toughest Army In The Middle East"
 SAU_Toughfest_army_in_the_middle_east_desc: "Forged in the meat-grinder of mountain warfare, urban sieges, and modern mechanized battles, our armed forces have evolved far beyond the ceremonial armies of the past. Combining cutting-edge Western hardware with tactical doctrines, the Royal Saudi Land Forces now stand as an untouchable force, ready to crush any threat that dares challenge our hegemony.""
 SAU_Resarch_and_Development_Expansion: "Research And Development Expansion"
 SAU_Resarch_and_Development_Expansion_desc: "While our academic and research in general is one of the best in the Middle East, there are still many points of improvement and further development."
