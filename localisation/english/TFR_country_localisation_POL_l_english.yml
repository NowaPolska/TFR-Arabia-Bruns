 PLD_the_Polish_economic_miracle_desc: "Following Polands Liberation from communist and Russian oppression, Polands Economy had one of the biggest Economic growth rates in the entirety of Europe, with 3 decedes of non-stop growth, Polands GDP exploded by up to 4 times since 1989. If this growth continues, Poland may become one of Europes biggest economyies."
 PLD_Dudas_Presidency: "Dudas Presidency"
 PLD_Dudas_Presidency_desc: "Andrzej Duda has been president of Poland since the 6th August of 2015. While Duda has made many reforms, including a successful pension reform and other smaller conservative ones, many controversies have plagued his Presidency, with the most polarising being the 2015 Polish constitutional crisis, in which PiS attempted to weaken Poland's justice system in order to pass more conservative legislation.\n\nWill PiS be able to hold on to power and secure their vision for Poland's future? Or will the opposition depose Polish conservatism once and for all?\n\nOnly God knows..."
